<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wang World Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; font: 14px system-ui, sans-serif; color: #e6e6e6; }
  canvas { display: block; outline: none; }
  #hud { position: fixed; top: 10px; left: 10px; background: rgba(16,20,26,.8); padding: 8px 12px; border-radius: 6px; line-height: 1.5; max-width: 320px; }
  #hud button { font: inherit; margin: 4px 0; }
  #hud label { display: block; cursor: pointer; }
  #info { opacity: .7; font-variant-numeric: tabular-nums; }
  #goal { color: #ffd54a; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">
  <div id="mode"></div>
  <div>W A S D / arrow keys move in both modes</div>
  <button id="walk">Walk inside the maze</button>
  <label><input type="checkbox" id="walls" checked> Show walls (H)</label>
  <label><input type="checkbox" id="props" checked> Show props &amp; lights (P)</label>
  <label id="ceilingRow" hidden><input type="checkbox" id="ceiling"> Show ceiling in orbit view (C)</label>
  <div id="goal"></div>
  <div id="info"></div>
</div>
<div id="msg"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ?obj=path/to/world.obj : the .mtl and the optional .json (sky, fog, lights, start/goal) sit next to it.
const objUrl = new URLSearchParams(location.search).get('obj') || '../world.obj';
const mtlUrl = objUrl.replace(/\.obj$/i, '.mtl');
const jsonUrl = objUrl.replace(/\.obj$/i, '.json');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); // alpha: the CSS sky shows through
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.tabIndex = 0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 1.4);
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1, 2, 0.5);
scene.add(hemi, sun);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 2000);
const orbit = new OrbitControls(camera, renderer.domElement);

const EYE = 0.3;      // eye height in walk mode; walls default to 0.6
const WALK_SPEED = 2; // cells per second
const NEAR_LIGHTS = 8;
const keys = new Set();
let mode = 'orbit';   // 'orbit' | 'walk'
let yaw = 0, pitch = 0;
let bounds = new THREE.Box3();
let saved = null;     // orbit camera state to restore when leaving walk mode
let mats = {};        // materials from the .mtl by name
let world = null;     // parsed .json, if present
let propMaterials = ['stone', 'crate', 'wood', 'leaf', 'cactus', 'rock', 'crystal', 'metal', 'snow', 'glow', 'flame'];
let goalReached = false;
let skyMesh = null;   // dome of clouds, when the world has a sky texture

const $ = (id) => document.getElementById(id);
const modeEl = $('mode'), infoEl = $('info'), goalEl = $('goal'), walkBtn = $('walk');
const wallsBox = $('walls'), propsBox = $('props'), ceilingBox = $('ceiling');

function showMessage(text) {
  const m = $('msg');
  m.textContent = text;
  m.style.display = 'grid';
}

const css = (c) => `rgb(${c.map((v) => Math.round(v * 255)).join(',')})`;

// ---- visibility toggles (materials, so they work with the single merged mesh) ----
function applyVisibility() {
  for (const n of ['wall', 'cliff']) if (mats[n]) mats[n].visible = wallsBox.checked;
  for (const n of propMaterials) if (mats[n]) mats[n].visible = propsBox.checked;
  if (mats.ceiling) mats.ceiling.visible = mode === 'walk' || ceilingBox.checked;
}
[wallsBox, propsBox, ceilingBox].forEach((b) => b.addEventListener('change', applyVisibility));

// The moody theme settings are tuned for walking; the orbit overview gets light fog and brighter light.
function applyLighting() {
  if (!world) return;
  const walking = mode === 'walk';
  if (scene.fog) scene.fog.density = world.fog.density * (walking ? 1 : 0.08);
  hemi.intensity = 1.4 * (walking ? world.ambient : Math.max(world.ambient, 0.9));
  sun.intensity = walking ? world.sun : Math.max(world.sun, 1.0);
}

function updateHud() {
  modeEl.textContent = mode === 'walk'
    ? 'Walking: drag (or move the mouse once locked) to look, Esc to leave'
    : 'Orbit: drag to rotate, wheel to zoom';
  walkBtn.textContent = mode === 'walk' ? 'Back to orbit view' : 'Walk inside the maze';
  applyVisibility();
  applyLighting();
}

// ---- theme: sky, fog, ambient and sun from the .json ----
function applyWorld(j) {
  world = j;
  document.body.style.background = `linear-gradient(${css(j.sky.top)}, ${css(j.sky.bottom)})`;
  if (j.fog && j.fog.density > 0) scene.fog = new THREE.FogExp2(new THREE.Color(...j.fog.color), j.fog.density);
  if (j.prop_materials) propMaterials = j.prop_materials;
  if (j.sky_texture) loadSky(objUrl.slice(0, objUrl.lastIndexOf('/') + 1) + j.sky_texture);
  applyLighting();
  $('ceilingRow').hidden = !j.ceiling;
  infoEl.textContent = `${j.theme} · ${j.size.w}×${j.size.h}` +
    (j.counts ? ` · ${j.counts.props} props, ${j.counts.water} water, ${j.counts.lights} lights` : '');
  if (j.goal) goalEl.textContent = `Goal: reach the gold beacon (${j.path_len} steps from the start)`;
}

// A few real point lights follow the camera and pick the nearest torches/crystals/pylons.
const lightPool = Array.from({ length: NEAR_LIGHTS }, () => {
  const l = new THREE.PointLight(0xffffff, 0, 3.5, 2);
  scene.add(l);
  return l;
});
let lightTimer = 0;
function updateNearLights() {
  const ls = world && world.lights;
  if (!ls || !ls.length) return;
  const cx = camera.position.x, cz = camera.position.z;
  const near = [];
  for (let i = 0; i < ls.length; i++) {
    const L = ls[i], dx = L[0] - cx, dz = L[2] - cz, d = dx * dx + dz * dz;
    if (near.length < NEAR_LIGHTS || d < near[near.length - 1].d) {
      near.push({ i, d });
      near.sort((a, b) => a.d - b.d);
      if (near.length > NEAR_LIGHTS) near.pop();
    }
  }
  lightPool.forEach((pl, k) => {
    const n = near[k];
    if (!n) { pl.intensity = 0; return; }
    const L = ls[n.i];
    pl.position.set(L[0], L[1], L[2]);
    pl.color.setRGB(L[3], L[4], L[5]);
    pl.intensity = 2.5 * L[6];
  });
}

// Sky dome from <stem>_sky.png (a seamless texture made from a tileset, e.g. the built-in "clouds").
function loadSky(url) {
  new THREE.TextureLoader().load(url, (tex) => {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.repeat.set(6, 2);
    const geo = new THREE.SphereGeometry(900, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2); // upper half only
    const mat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false });
    skyMesh = new THREE.Mesh(geo, mat);
    skyMesh.renderOrder = -1;
    scene.add(skyMesh);
  }, undefined, () => console.warn('Could not load the sky texture', url));
}

function frame(object) {
  bounds.setFromObject(object);
  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.z);
  camera.position.set(center.x, span * 0.9, center.z + span * 0.7);
  orbit.target.copy(center);
  orbit.update();
}

// Load the optional .json first so the sky is right before the model appears.
fetch(jsonUrl).then((r) => (r.ok ? r.json() : null)).catch(() => null).then((j) => {
  if (j) applyWorld(j);
  new MTLLoader().load(mtlUrl, (materials) => {
    materials.preload();
    for (const [name, m] of Object.entries(materials.materials)) {
      m.side = THREE.DoubleSide;
      if (['glow', 'flame', 'start', 'goal'].includes(name)) { m.emissive = m.color.clone(); m.emissiveIntensity = 1.0; }
      if (name === 'crystal') { m.emissive = m.color.clone(); m.emissiveIntensity = 0.35; }
      if (name === 'water') m.depthWrite = false;
    }
    mats = materials.materials;
    applyVisibility();
    const objLoader = new OBJLoader();
    objLoader.setMaterials(materials);
    objLoader.load(objUrl, (object) => { scene.add(object); frame(object); },
      undefined, () => showMessage(`Could not load ${objUrl}`));
  }, undefined, () => showMessage(`Could not load ${mtlUrl}. Generate one with: ./wang_cli --obj world.obj, then serve the repo root over http (python3 -m http.server).`));
});

// ---- first person ----
function applyLook() {
  camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
}

function enterWalk() {
  saved = { pos: camera.position.clone(), target: orbit.target.clone() };
  mode = 'walk';
  orbit.enabled = false;
  goalReached = false;
  // Start pad if the world has one (facing the goal), otherwise the first cell facing into the maze.
  if (world && world.start && world.goal) {
    camera.position.set(world.start.x, EYE, world.start.z);
    yaw = Math.atan2(-(world.goal.x - world.start.x), -(world.goal.z - world.start.z));
  } else {
    camera.position.set(bounds.min.x + 0.5, EYE, bounds.min.z + 0.5);
    yaw = Math.PI; // the camera looks down -z at yaw 0, so turn towards +z (grid down)
  }
  pitch = 0;
  applyLook();
  renderer.domElement.focus();
  // Pointer lock gives smooth mouse look, but is optional: drag-to-look works without it.
  try { renderer.domElement.requestPointerLock?.()?.catch?.(() => {}); } catch (e) { /* unsupported */ }
  updateHud();
}

function leaveWalk() {
  mode = 'orbit';
  if (document.pointerLockElement) document.exitPointerLock();
  if (saved) {
    camera.position.copy(saved.pos);
    orbit.target.copy(saved.target);
  }
  orbit.enabled = true;
  orbit.update();
  goalEl.style.color = '';
  if (world && world.goal) goalEl.textContent = `Goal: reach the gold beacon (${world.path_len} steps from the start)`;
  updateHud();
}

walkBtn.addEventListener('click', () => (mode === 'walk' ? leaveWalk() : enterWalk()));

// Mouse look: while pointer-locked, or while dragging if lock is unavailable.
let dragging = false;
renderer.domElement.addEventListener('pointerdown', () => { dragging = true; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (mode !== 'walk') return;
  if (!dragging && document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.003;
  pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.003));
  applyLook();
});

const flip = (box) => { box.checked = !box.checked; applyVisibility(); };
addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && mode === 'walk') { leaveWalk(); return; }
  if (!e.repeat) {
    if (e.code === 'KeyH') { flip(wallsBox); return; }
    if (e.code === 'KeyP') { flip(propsBox); return; }
    if (e.code === 'KeyC' && !$('ceilingRow').hidden) { flip(ceilingBox); return; }
  }
  keys.add(e.code);
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0);
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const r = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);

  if (f || r) {
    // Move along the ground plane in the direction the camera faces.
    camera.getWorldDirection(forward);
    forward.y = 0;
    if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
    forward.normalize();
    right.crossVectors(forward, up).normalize();
    const step = (mode === 'walk' ? WALK_SPEED : Math.max(1, camera.position.y) * 0.8) * dt;
    const move = forward.multiplyScalar(f * step).add(right.multiplyScalar(r * step));
    camera.position.add(move);
    if (mode === 'orbit') orbit.target.add(move); // pan, so orbiting stays centred on the view
  }

  if (mode === 'orbit') orbit.update();
  else camera.position.y = EYE;

  if (skyMesh) {
    skyMesh.position.copy(camera.position);       // the sky stays put relative to the viewer
    skyMesh.material.map.offset.x += dt * 0.004;  // and the clouds drift
  }

  lightTimer -= dt;
  if (lightTimer <= 0) { updateNearLights(); lightTimer = 0.15; }

  let text = `x ${camera.position.x.toFixed(1)}  z ${camera.position.z.toFixed(1)}`;
  if (mode === 'walk' && world && world.goal) {
    const d = Math.hypot(camera.position.x - world.goal.x, camera.position.z - world.goal.z);
    if (d < 0.45 && !goalReached) { goalReached = true; goalEl.textContent = 'You reached the goal!'; goalEl.style.color = '#7dff9a'; }
    text += `  ·  goal ${d.toFixed(1)} away`;
  }
  infoEl.dataset.pos = text;
  infoEl.textContent = (world ? `${world.theme} · ${world.size.w}×${world.size.h}\n` : '') + text;
  infoEl.style.whiteSpace = 'pre-line';
  renderer.render(scene, camera);
});
</script>
</body>
</html>
