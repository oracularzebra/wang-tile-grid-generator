<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wang World Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; font: 14px system-ui, sans-serif; color: #e6e6e6; }
  canvas { display: block; outline: none; }
  #hud { position: fixed; top: 10px; left: 10px; background: rgba(16,20,26,.8); padding: 8px 12px; border-radius: 6px; line-height: 1.5; }
  #hud button { font: inherit; margin-top: 4px; }
  #pos { opacity: .6; font-variant-numeric: tabular-nums; }
  #msg { position: fixed; inset: 0; display: none; place-items: center; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="hud">
  <div id="mode"></div>
  <div>W A S D / arrow keys move in both modes</div>
  <button id="walk">Walk inside the maze</button>
  <div id="pos"></div>
</div>
<div id="msg"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ?obj=path/to/world.obj (its .mtl is expected next to it), relative to this page.
const objUrl = new URLSearchParams(location.search).get('obj') || '../world.obj';
const mtlUrl = objUrl.replace(/\.obj$/i, '.mtl');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.tabIndex = 0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141a);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1, 2, 0.5);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 2000);
const orbit = new OrbitControls(camera, renderer.domElement);

const EYE = 0.3;      // eye height in walk mode; walls default to 0.6
const WALK_SPEED = 2; // cells per second
const keys = new Set();
let mode = 'orbit';   // 'orbit' | 'walk'
let yaw = 0, pitch = 0;
let bounds = new THREE.Box3();
let saved = null;     // orbit camera state to restore when leaving walk mode

const modeEl = document.getElementById('mode');
const posEl = document.getElementById('pos');
const walkBtn = document.getElementById('walk');

function showMessage(text) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.style.display = 'grid';
}

function updateHud() {
  modeEl.textContent = mode === 'walk'
    ? 'Walking: drag (or move the mouse once locked) to look, Esc to leave'
    : 'Orbit: drag to rotate, wheel to zoom';
  walkBtn.textContent = mode === 'walk' ? 'Back to orbit view' : 'Walk inside the maze';
}
updateHud();

function frame(object) {
  bounds.setFromObject(object);
  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());
  const span = Math.max(size.x, size.z);
  camera.position.set(center.x, span * 0.9, center.z + span * 0.7);
  orbit.target.copy(center);
  orbit.update();
}

const mtlLoader = new MTLLoader();
mtlLoader.load(mtlUrl, (materials) => {
  materials.preload();
  for (const m of Object.values(materials.materials)) m.side = THREE.DoubleSide;
  const objLoader = new OBJLoader();
  objLoader.setMaterials(materials);
  objLoader.load(objUrl, (object) => { scene.add(object); frame(object); },
    undefined, () => showMessage(`Could not load ${objUrl}`));
}, undefined, () => showMessage(`Could not load ${mtlUrl}. Generate one with: ./wang_cli --obj world.obj, then serve the repo root over http (python3 -m http.server).`));

function applyLook() {
  camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
}

function enterWalk() {
  saved = { pos: camera.position.clone(), target: orbit.target.clone() };
  mode = 'walk';
  orbit.enabled = false;
  // Start in the first cell, facing into the maze (+z is grid down).
  camera.position.set(bounds.min.x + 0.5, EYE, bounds.min.z + 0.5);
  yaw = Math.PI; // camera looks down -z at yaw 0, so turn around
  pitch = 0;
  applyLook();
  renderer.domElement.focus();
  // Pointer lock gives smooth mouse look, but is optional: drag-to-look works without it.
  try { renderer.domElement.requestPointerLock?.()?.catch?.(() => {}); } catch (e) { /* unsupported */ }
  updateHud();
}

function leaveWalk() {
  mode = 'orbit';
  if (document.pointerLockElement) document.exitPointerLock();
  if (saved) {
    camera.position.copy(saved.pos);
    orbit.target.copy(saved.target);
  }
  orbit.enabled = true;
  orbit.update();
  updateHud();
}

walkBtn.addEventListener('click', () => (mode === 'walk' ? leaveWalk() : enterWalk()));

// Mouse look: while pointer-locked, or while dragging if lock is unavailable.
let dragging = false;
renderer.domElement.addEventListener('pointerdown', () => { dragging = true; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', (e) => {
  if (mode !== 'walk') return;
  if (!dragging && document.pointerLockElement !== renderer.domElement) return;
  yaw -= e.movementX * 0.003;
  pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.003));
  applyLook();
});

addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && mode === 'walk') { leaveWalk(); return; }
  keys.add(e.code);
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const up = new THREE.Vector3(0, 1, 0);
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const f = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  const r = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);

  if (f || r) {
    // Move along the ground plane in the direction the camera faces.
    camera.getWorldDirection(forward);
    forward.y = 0;
    if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
    forward.normalize();
    right.crossVectors(forward, up).normalize();
    const step = (mode === 'walk' ? WALK_SPEED : Math.max(1, camera.position.y) * 0.8) * dt;
    const move = forward.multiplyScalar(f * step).add(right.multiplyScalar(r * step));
    camera.position.add(move);
    if (mode === 'orbit') orbit.target.add(move); // pan, so orbiting stays centred on the view
  }

  if (mode === 'orbit') orbit.update();
  else camera.position.y = EYE;

  posEl.textContent = `x ${camera.position.x.toFixed(1)}  z ${camera.position.z.toFixed(1)}`;
  renderer.render(scene, camera);
});
</script>
</body>
</html>
